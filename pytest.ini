[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test selection
markers =
    unit: unit test (run with -m unit)
    integration: integration test (run with -m integration)
    e2e: end-to-end test (run with -m e2e)
    slow: slow test (skip with -m 'not slow')
    db: database test
    ui: UI test
    windows: mark test as Windows-only
    gui: mark test as requiring GUI interaction
    vision: mark test as vision/image processing test

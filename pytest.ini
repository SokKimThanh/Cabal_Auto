[pytest]
# Pytest configuration for Cabal_Auto project

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    windows: Tests that require Windows OS (ctypes.WinDLL, win32 APIs)
    gui: Tests that require GUI interaction (pyautogui, screen capture)
    manual: Tests requiring manual user interaction (not for CI automation)
    integration: Integration tests that test multiple components together
    unit: Unit tests that test individual functions/classes in isolation
    vision: Tests related to computer vision and image processing
    slow: Tests that take significant time to execute
    performance: Performance and benchmark tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.10

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "fix/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-linux:
    name: Test on Linux (Cross-platform tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov pytest-xdist pytest-timeout
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Set up virtual display (Xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1024x768x24 &
        sleep 3
        echo "DISPLAY=:99" >> $GITHUB_ENV
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest (with coverage)
      timeout-minutes: 10
      run: |
        export PYTHONPATH="${PYTHONPATH}:$(pwd)"
        export DISPLAY=:99
        pytest -v --tb=short --strict-markers --timeout=60 --timeout-method=thread \
          --cov=lib --cov=ui --cov-report=term-missing \
          tests/unit tests/integration \
          -m "not windows and not gui and not manual"

  stub-guard:
    name: Detect new stub/placeholder code in diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Scan added lines for stub/placeholder patterns
      run: |
        git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
        git diff --unified=0 "origin/${{ github.base_ref }}"..."HEAD" -- '*.py' \
          | grep -E '^\+' \
          | grep -viE '^\+\+\+' \
          | grep -inE 'NotImplementedError|#\s*(TODO|FIXME|stub|placeholder)|^\+\s*pass\s*(#.*)?$' \
          > stub_matches.txt || true
        if [ -s stub_matches.txt ]; then
          echo "::warning::Found possible stub/placeholder code added in this PR:"
          cat stub_matches.txt
          echo "Review whether these replace real behavior migrated from app_gui.py (see .jules/prompts/architecture-cleanup/README.md)."
        else
          echo "No stub/placeholder patterns detected in added lines."
        fi

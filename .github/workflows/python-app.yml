# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "fix/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-linux:
    name: Test on Linux (Cross-platform tests)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov pytest-xdist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Set up virtual display (Xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1024x768x24 &
        sleep 3
        echo "DISPLAY=:99" >> $GITHUB_ENV
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    # - name: Test with pytest
    #   run: |
    #     export PYTHONPATH="${PYTHONPATH}:$(pwd)"
    #     export DISPLAY=:99
    #     pytest -v --tb=short --strict-markers -m "not windows and not gui and not manual"

    - name: Generate test coverage report
      if: success()
      run: |
        export PYTHONPATH="${PYTHONPATH}:$(pwd)"
        export DISPLAY=:99
        pytest --cov=lib --cov=ui --cov-report=term-missing -m "not windows and not gui and not manual"

# .github/workflows/copilot-code-review.yml
name: Copilot Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copilot Review
        uses: github/copilot-code-review-action@latest
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
